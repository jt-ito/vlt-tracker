name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Fix node-gyp for VS2022
        if: matrix.os == 'windows-latest'
        run: |
          npm install -g node-gyp@latest
          $nodeGypPath = (npm root -g) + "\node-gyp\bin\node-gyp.js"
          echo "npm_config_node_gyp=$nodeGypPath" >> $env:GITHUB_ENV
          
      - name: Install Dependencies
        run: npm ci
        
      - name: Build and Publish Electron Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --publish always

      - name: Create Linux CLI Bundle
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p vlt-tracker-cli
          cp server.js index.html login.html favicon.svg package.json vlt-tracker-cli/
          cp -r extensions vlt-tracker-cli/
          cp -r node_modules vlt-tracker-cli/
          echo '#!/bin/bash' > vlt-tracker-cli/vlt-tracker.sh
          echo 'cd "$(dirname "$0")"' >> vlt-tracker-cli/vlt-tracker.sh
          echo 'node server.js "$@"' >> vlt-tracker-cli/vlt-tracker.sh
          chmod +x vlt-tracker-cli/vlt-tracker.sh
          tar -czf vlt-tracker-linux-cli.tar.gz vlt-tracker-cli/
        shell: bash
        
      - name: Upload Linux CLI Bundle
        if: matrix.os == 'ubuntu-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: vlt-tracker-linux-cli.tar.gz
